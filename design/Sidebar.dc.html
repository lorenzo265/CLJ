<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FAF7F2; --panel:#FFFFFF; --border:#E4DDD0; --border-soft:#EFEAE1;
  --text:#262320; --text-muted:#6E6862; --text-faint:#A9A199;
  --accent:#253990; --accent-ink:#1A2A6C; --accent-soft:#E4E7F7;
  --accent-hi:#6C7CC9;
  --gold:#A9812F; --gold-ink:#7A5D22; --gold-soft:#F3E9D2;
}
*{box-sizing:border-box}
.serif{font-family:"Source Serif 4",Georgia,serif;letter-spacing:-0.01em;}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--panel);}
a{color:var(--accent-ink)} a:hover{color:var(--accent)}

/* A cruz — âncora do fio, a marca */
.s-cross{width:26px;height:30px;position:relative;flex-shrink:0;}
.s-cross::before{content:"";position:absolute;left:50%;top:1px;transform:translateX(-50%);width:5px;height:26px;border-radius:3px;background:linear-gradient(135deg,var(--accent-hi),var(--accent-ink));}
.s-cross::after{content:"";position:absolute;left:50%;top:8px;transform:translateX(-50%);width:18px;height:5px;border-radius:3px;background:linear-gradient(135deg,var(--accent-hi),var(--accent-ink));}

/* O fio — o cordão que atravessa a navegação */
.r-list{position:relative;display:flex;flex-direction:column;}
.r-list::before{content:"";position:absolute;left:6px;top:-12px;bottom:6px;width:2px;border-radius:2px;background:linear-gradient(to bottom,var(--border-soft),var(--border) 10%,var(--border) 90%,var(--border-soft));}

.r-klabel{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9.5px;font-weight:600;letter-spacing:0.09em;text-transform:uppercase;color:var(--text-faint);margin:0 0 5px 28px;}

/* As contas do Pai-Nosso — os itens do menu */
.r-item{display:flex;align-items:center;gap:13px;padding:8px 6px 8px 0;position:relative;font-size:13.5px;color:var(--text);font-weight:500;transition:color 160ms ease;}
.r-bead{width:14px;height:14px;border-radius:50%;z-index:1;flex-shrink:0;
  background:radial-gradient(circle at 35% 28%, var(--panel) 0%, var(--bg) 60%, #D9D2C4 100%);
  border:1px solid var(--border);
  box-shadow:inset -1px -2px 3px rgba(38,35,32,0.13), 0 1px 2px rgba(38,35,32,0.10);
  transition:transform 200ms cubic-bezier(0.16,1,0.3,1);}
.r-item.on{color:var(--accent-ink);font-weight:700;}
.r-item.on .r-bead{
  background:radial-gradient(circle at 35% 28%, var(--accent-hi) 0%, var(--accent) 60%, var(--accent-ink) 100%);
  border-color:var(--accent-ink);
  box-shadow:inset -1px -2px 3px rgba(0,0,0,0.24), 0 1px 3px rgba(37,57,144,0.35);}

/* As três Ave-Marias — separador entre grupos */
.r-sep{position:relative;z-index:1;display:flex;flex-direction:column;gap:4px;padding:7px 0 7px 3.5px;}
.r-sep i{width:7px;height:7px;border-radius:50%;display:block;
  background:radial-gradient(circle at 35% 28%, var(--panel) 0%, var(--bg) 65%, #D9D2C4 100%);
  border:1px solid var(--border);
  box-shadow:inset -1px -1px 2px rgba(38,35,32,0.11);}
</style>
</helmet>
<div style="width:260px;height:100%;min-height:760px;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:20px 16px;gap:20px;overflow:hidden;">

  <div style="display:flex;align-items:center;gap:12px;">
    <div class="s-cross"></div>
    <div>
      <div class="serif" style="font-size:17px;font-weight:700;">CLJ NSR</div>
      <div style="font-size:11px;color:var(--text-muted);margin-top:1px;">Departamento Cultural</div>
    </div>
  </div>

  <div class="r-list" style="flex:1;min-height:0;">
    <div class="r-klabel">Meu espaço</div>

    <div class="r-item {{cadastro.cls}}"><span class="r-bead"></span><span>Cadastro</span></div>
    <div class="r-item {{escala.cls}}"><span class="r-bead"></span><span>Escala</span></div>
    <div class="r-item {{calendario.cls}}"><span class="r-bead"></span><span>Calendário</span></div>
    <div class="r-item {{reunioes.cls}}"><span class="r-bead"></span><span>Reuniões</span></div>

    <sc-if value="{{isCoord}}" hint-placeholder-val="{{true}}">
    <div style="display:flex;flex-direction:column;">
      <div class="r-sep"><i></i><i></i><i></i></div>
      <div class="r-klabel">Coordenação</div>
      <div class="r-item {{painel.cls}}"><span class="r-bead"></span><span>Painel</span></div>
      <div class="r-item {{funcoes.cls}}"><span class="r-bead"></span><span>Funções</span></div>
      <div class="r-item {{gescala.cls}}"><span class="r-bead"></span><span>Gestão de Escala</span></div>
      <div class="r-item {{greunioes.cls}}"><span class="r-bead"></span><span>Gestão de Reuniões</span></div>
      <div class="r-item {{participantes.cls}}"><span class="r-bead"></span><span>Participantes</span></div>
    </div>
    </sc-if>
  </div>

  <div style="display:flex;align-items:center;gap:10px;padding:12px 10px 0;border-top:1px solid var(--border-soft);">
    <div style="width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex-shrink:0;">MA</div>
    <div style="display:flex;flex-direction:column;min-width:0;">
      <div style="font-size:13px;font-weight:600;">Maria A.</div>
      <div style="font-size:11.5px;color:var(--text-muted);">{{roleLabel}}</div>
    </div>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","default":"cadastro","options":["cadastro","escala","calendario","reunioes","painel","funcoes","gescala","greunioes","participantes"],"section":"Nav"},"role":{"editor":"enum","default":"participante","options":["participante","coordenador"],"section":"Nav"}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'cadastro';
    const role = this.props.role ?? 'participante';
    const s = (id) => ({ cls: active === id ? 'on' : '' });
    return {
      isCoord: role === 'coordenador',
      roleLabel: role === 'coordenador' ? 'Coordenador' : 'Participante',
      cadastro: s('cadastro'),
      escala: s('escala'),
      calendario: s('calendario'),
      reunioes: s('reunioes'),
      painel: s('painel'),
      funcoes: s('funcoes'),
      gescala: s('gescala'),
      greunioes: s('greunioes'),
      participantes: s('participantes'),
    };
  }
}
</script>
</body>
</html>
