<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FAF7F2; --panel:#FFFFFF; --border:#E4DDD0; --border-soft:#EFEAE1;
  --text:#262320; --text-muted:#6E6862; --text-faint:#A9A199;
  --accent:#253990; --accent-ink:#1A2A6C; --accent-soft:#E4E7F7;
  --accent-hi:#6C7CC9;
  --gold:#A9812F; --gold-ink:#7A5D22; --gold-soft:#F3E9D2;
}
*{box-sizing:border-box}
.serif{font-family:"Source Serif 4",Georgia,serif;letter-spacing:-0.01em;}
.mono{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg);}
a{color:var(--accent-ink)} a:hover{color:var(--accent)}
.wd{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:9px;font-weight:600;letter-spacing:0.06em;color:var(--text-faint);text-align:center;padding:6px 0;}
.cell{min-height:48px;display:flex;flex-direction:column;align-items:center;gap:3px;padding-top:6px;border-top:1px solid var(--border-soft);}
.num{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:11.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;}
.num.today{background:var(--accent);color:#fff;font-weight:600;}
.mark{width:7px;height:7px;border-radius:50%;flex-shrink:0;background:var(--panel);border:1.5px solid var(--text-faint);}
.mark.mine{background:var(--accent);border-color:var(--accent);}
.card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:12px 14px;min-height:48px;}
.klabel{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:10px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--text-faint);}
.datelbl{font-family:"IBM Plex Mono","SFMono-Regular",Consolas,monospace;font-size:10.5px;color:var(--text-muted);font-variant-numeric:tabular-nums;}
</style>
</helmet>
<div style="width:390px;height:844px;background:var(--bg);display:flex;flex-direction:column;">

  <div style="flex:1;overflow:auto;padding:24px 20px 16px;display:flex;flex-direction:column;gap:18px;">

    <div style="display:flex;align-items:center;justify-content:space-between;">
      <div class="serif" style="font-size:22px;font-weight:700;">Calendário</div>
      <div style="display:flex;align-items:center;gap:10px;">
        <span style="display:inline-flex;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);align-items:center;justify-content:center;background:var(--panel);"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="12,5 7,10 12,15"/></svg></span>
        <span class="mono" style="font-size:12px;font-weight:600;">AGO 2026</span>
        <span style="display:inline-flex;width:28px;height:28px;border-radius:8px;border:1px solid var(--border);align-items:center;justify-content:center;background:var(--panel);"><svg width="12" height="12" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="8,5 13,10 8,15"/></svg></span>
      </div>
    </div>

    <div style="background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:10px 12px 14px;">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);">
        <div class="wd">D</div><div class="wd">S</div><div class="wd">T</div><div class="wd">Q</div><div class="wd">Q</div><div class="wd">S</div><div class="wd">S</div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);">
        <div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"></div><div class="cell" style="border-top:none;"><span class="num">1</span></div>
        <div class="cell"><span class="num">2</span></div>
        <div class="cell"><span class="num">3</span><span class="mark mine"></span></div>
        <div class="cell"><span class="num">4</span><span class="mark"></span></div>
        <div class="cell"><span class="num">5</span><span class="mark"></span></div>
        <div class="cell"><span class="num">6</span></div>
        <div class="cell"><span class="num">7</span><span class="mark"></span></div>
        <div class="cell"><span class="num">8</span></div>
        <div class="cell"><span class="num">9</span></div>
        <div class="cell"><span class="num">10</span><span class="mark mine"></span></div>
        <div class="cell"><span class="num">11</span></div>
        <div class="cell"><span class="num">12</span></div>
        <div class="cell"><span class="num">13</span></div>
        <div class="cell"><span class="num">14</span><span class="mark"></span></div>
        <div class="cell"><span class="num">15</span></div>
        <div class="cell"><span class="num">16</span></div>
        <div class="cell"><span class="num">17</span></div>
        <div class="cell"><span class="num">18</span></div>
        <div class="cell"><span class="num">19</span></div>
        <div class="cell"><span class="num">20</span><span class="mark mine"></span></div>
        <div class="cell"><span class="num">21</span></div>
        <div class="cell"><span class="num">22</span></div>
        <div class="cell"><span class="num">23</span></div>
        <div class="cell"><span class="num">24</span></div>
        <div class="cell"><span class="num today">25</span></div>
        <div class="cell"><span class="num">26</span><span class="mark mine"></span></div>
        <div class="cell"><span class="num">27</span></div>
        <div class="cell"><span class="num">28</span><span class="mark"></span></div>
        <div class="cell"><span class="num">29</span></div>
        <div class="cell"><span class="num">30</span></div>
        <div class="cell"><span class="num">31</span></div>
        <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      </div>
    </div>

    <div style="display:flex;align-items:center;gap:14px;font-size:11px;color:var(--text-muted);flex-wrap:wrap;">
      <span style="display:flex;align-items:center;gap:6px;"><span class="mark mine"></span>sua conta</span>
      <span style="display:flex;align-items:center;gap:6px;"><span class="mark"></span>departamento</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px;">
      <div class="klabel">Próximos</div>
      <div class="card" style="background:var(--accent-soft);border-color:var(--accent-soft);">
        <div class="datelbl" style="color:var(--accent-ink);">QUA 26/08 · É SUA VEZ</div>
        <div style="font-size:14px;font-weight:700;margin-top:3px;color:var(--accent-ink);">Reunião de equipe</div>
      </div>
      <div class="card">
        <div class="datelbl">SEX 28/08</div>
        <div style="font-size:14px;font-weight:600;margin-top:3px;">Reunião quinzenal · 19h30</div>
      </div>
    </div>

  </div>

  <dc-import name="MobileNav" active="calendario" hint-size="390px,64px"></dc-import>
</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
