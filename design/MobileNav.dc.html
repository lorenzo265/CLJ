<!doctype html>
<html>
<head>
<meta charset="utf-8">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&family=Public+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
:root{
  --bg:#FAF7F2; --panel:#FFFFFF; --border:#E4DDD0; --border-soft:#EFEAE1;
  --text:#262320; --text-muted:#6E6862; --text-faint:#A9A199;
  --accent:#253990; --accent-ink:#1A2A6C; --accent-soft:#E4E7F7;
  --accent-hi:#6C7CC9;
  --gold:#A9812F; --gold-ink:#7A5D22; --gold-soft:#F3E9D2;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--panel);}
a{color:var(--accent-ink)} a:hover{color:var(--accent)}
.nav{width:390px;height:64px;background:var(--panel);border-top:1px solid var(--border);display:flex;}
.ni{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:10px;font-weight:600;color:var(--text-muted);min-height:44px;}
.ni.on{color:var(--accent-ink);font-weight:700;}
.ni .dot{width:4px;height:4px;border-radius:50%;background:transparent;}
.ni.on .dot{background:var(--accent);}
</style>
</helmet>
<div class="nav">
  <div class="ni {{hoje.cls}}">
    <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="6.5"/><polyline points="7.4,10.1 9.2,11.9 12.7,8.4"/></svg>
    <span>Hoje</span>
    <span class="dot"></span>
  </div>
  <div class="ni {{escala.cls}}">
    <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="5.5" x2="16" y2="5.5"/><line x1="4" y1="10" x2="16" y2="10"/><line x1="4" y1="14.5" x2="12" y2="14.5"/></svg>
    <span>Escala</span>
    <span class="dot"></span>
  </div>
  <div class="ni {{calendario.cls}}">
    <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4.5" width="14" height="12" rx="1.8"/><line x1="3" y1="8" x2="17" y2="8"/><line x1="7" y1="2.8" x2="7" y2="5.5"/><line x1="13" y1="2.8" x2="13" y2="5.5"/></svg>
    <span>Calendário</span>
    <span class="dot"></span>
  </div>
  <div class="ni {{voce.cls}}">
    <svg width="21" height="21" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="7.2" r="3"/><path d="M4.2 17c0-3.4 2.8-5.8 5.8-5.8s5.8 2.4 5.8 5.8"/></svg>
    <span>Você</span>
    <span class="dot"></span>
  </div>
</div>
</x-dc>
<script data-dc-script data-props='{"active":{"editor":"enum","default":"hoje","options":["hoje","escala","calendario","voce"],"section":"Nav"}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'hoje';
    const s = (id) => ({ cls: active === id ? 'on' : '' });
    return { hoje: s('hoje'), escala: s('escala'), calendario: s('calendario'), voce: s('voce') };
  }
}
</script>
</body>
</html>
